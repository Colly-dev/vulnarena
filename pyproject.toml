[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnarena"
version = "0.1.0"
description = "Intentionally Vulnerable Web App Lab for Pentest Practice"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VulnArena Team"}
]
dependencies = [
    "flask>=2.3.0",
    "flask-sqlalchemy>=3.0.0",
    "flask-login>=0.6.0",
    "flask-wtf>=1.0.0",
    "flask-cors>=4.0.0",
    "werkzeug>=2.3.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.5.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "colorlog>=6.7.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "sqlalchemy>=2.0.0",
    "pytest>=7.4.0",
    "pytest-flask>=1.2.0",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "tqdm>=4.66.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
