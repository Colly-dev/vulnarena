{% extends "base.html" %}
{% block title %}File Upload Lab{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        <h1>Insecure File Upload</h1>
        <p>This form allows you to upload any file to the server. Try uploading a <code>.html</code> file with a script tag or a <code>.php</code> file.</p>
        
        <div class="card">
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Choose file</label>
                        <input type="file" name="file" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-danger">Upload File</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
